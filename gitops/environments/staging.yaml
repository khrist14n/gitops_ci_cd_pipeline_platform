replicaCount: 2

image:
  repository: ghcr.io/example/demo-app
  pullPolicy: IfNotPresent
  tag: latest
  digest: ""

telemetry:
  newrelic:
    enabled: true
    appNameOverride: demo-app-staging
    logLevel: debug

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true

# Staging validates the canary + auto-rollback machinery end-to-end.
progressiveDelivery:
  enabled: true
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: { duration: 15s }
        - setWeight: 50
        - pause: { duration: 15s }
        - setWeight: 100