replicaCount: 10

image:
  repository: ghcr.io/example/demo-app
  pullPolicy: IfNotPresent
  tag: latest
  digest: ""

telemetry:
  newrelic:
    enabled: true
    appNameOverride: demo-app-prod
    logLevel: info

autoscaling:
  enabled: true
  minReplicas: 10
  maxReplicas: 40
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 8

serviceMonitor:
  enabled: true
  interval: 15s

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: demo-app.example.com
      paths:
        - path: /
          pathType: Prefix

# Full canary with SLO-driven auto rollback.
progressiveDelivery:
  enabled: true
  strategy:
    canary:
      steps:
        - setWeight: 5
        - pause: { duration: 2m }
        - setWeight: 25
        - pause: { duration: 2m }
        - setWeight: 50
        - pause: { duration: 2m }
        - setWeight: 100
  analysis:
    interval: 15s
    successCondition: 'result[0] < 0.01'
    errorRateThreshold: "0.01"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi