[tox]
envlist = py, lint
minversion = 4.0

[testenv]
skip_install = true

[testenv:py]
description = run demo-app unit tests with pytest
change_dir = {toxinidir}/apps/demo-app
deps = -r{toxinidir}/apps/demo-app/requirements-dev.txt
commands =
    python -m pytest tests -q

[testenv:lint]
description = lint and format-check with ruff
deps = ruff==0.16.6
commands =
    ruff check apps/demo-app
    ruff format --check apps/demo-app