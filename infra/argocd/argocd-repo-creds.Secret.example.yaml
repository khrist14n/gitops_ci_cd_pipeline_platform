# Example: repository + registry credentials for ArgoCD.
# Apply the required values with a sealed secret / external secrets (AWS Secrets Manager or vault).
apiVersion: v1
kind: Secret
metadata:
  name: argocd-repo-creds
  namespace: argocd
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
type: Opaque
stringData:
  # Git repo token with read scope on the gitops repo.
  username: gitops-bot
  password: replace-me
data:
  # For private image registries that the app needs to pull from (ghcr.io example).
  # Declared via the chart's imagePullSecrets instead when registry is public.
  "": ""