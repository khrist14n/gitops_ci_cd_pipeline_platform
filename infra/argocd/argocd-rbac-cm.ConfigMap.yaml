apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
data:
  policy.default: role:readonly
  policy.csv: |
    p, role:readonly, applications, get, *, allow
    p, role:readonly, projects, get, *, allow

    p, role:ci-deploy, applications, sync, gitops-platform/*, allow
    p, role:ci-deploy, applications, action/*, gitops-platform/*, allow
    p, role:ci-deploy, applications, rollback, gitops-platform/*, allow

    # Read-only for standard users, write for the CI bot mapped via OIDC group.
    g, github:org:platform-deploy-bot, role:ci-deploy
    g, github:org:devops, role:readonly