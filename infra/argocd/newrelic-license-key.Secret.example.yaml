# New Relic license key provisioning for demo-app.
#
# The in-cluster Secret referenced by the chart's
# `telemetry.newrelic.licenseKeySecret` (default name `newrelic-license-key`,
# key `NEW_RELIC_LICENSE_KEY`). The runtime value must be encrypted, never
# committed as plaintext — use Sealed Secrets or ExternalSecrets:
#
#   Sealed Secrets (manual):
#     kubectl create secret generic newrelic-license-key \
#       --namespace demo-app-prod --from-literal=NEW_RELIC_LICENSE_KEY='<key>' \
#       --dry-run=client -o yaml \
#       | kubeseal --format yaml > newrelic-license-key.SealedSecret.yaml
#     kubectl apply -f newrelic-license-key.SealedSecret.yaml
#
#   ExternalSecrets Operator (recommended, rotates from Cloud):
#     apiVersion: external-secrets.io/v1
#     kind: ExternalSecret
#     metadata: {name: newrelic-license-key, namespace: demo-app-prod}
#     spec:
#       secretStoreRef: {name: vault-global, kind: SecretStore}
#       target: {name: newrelic-license-key}
#       data:
#         - secretKey: NEW_RELIC_LICENSE_KEY
#           remoteRef: { key: "gitops/newrelic/LICENSE_KEY" }
apiVersion: v1
kind: Secret
metadata:
  name: newrelic-license-key
  namespace: demo-app-prod
type: Opaque
stringData:
  # NEVER store real keys in git. Placeholder only; must be encrypted at apply time.
  NEW_RELIC_LICENSE_KEY: replace-with-provisioned-key