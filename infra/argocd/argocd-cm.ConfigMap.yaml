apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
  annotations:
    avp.kubernetes.io/path: "argocd#argocd-cm"
data:
  # Track resources so drift detection can reconcile cross-owner mutations.
  application.resourceTrackingMethod: annotation
  applicationset.enable.goTemplate: "true"

  # Disable built-in Dex (we use GitHub OIDC directly via auth.dex or SSO).
  dex.config: ""

  url: https://argocd.example.com

  # Only auto-sync images that are pinned (immutable digests) in prod overlays.
  configManagementPlugins: |-
    - name: helm-gitops
      generate:
        command: ["helm"]
        args: ["template", "{{ .Path }}", "-f", "{{ .Path }}/../gitops/environments/prod.yaml"]

  # Repository credentials referenced by name (Secret argocd-repo-creds).
  repositories: |-
    - url: https://github.com/example/gitops_ci_cd_pipeline_platform
      name: gitops-platform
      type: git
      credentialsSecretRef:
        name: argocd-repo-creds
        namespace: argocd